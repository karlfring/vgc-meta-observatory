name: Ingestion mensuelle Smogon

# Smogon publie les stats d'un mois le 1er du mois suivant, vers 23h UTC.
# On déclenche le 2 à 06h17 UTC pour laisser la publication se terminer.
on:
  schedule:
    - cron: "17 6 2 * *"
  workflow_dispatch:
    inputs:
      regulation:
        description: "Régulation à ingérer (vide = régulation courante)"
        required: false
        type: string

jobs:
  ingerer:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest tests/ -q

      - name: Ingestion
        run: |
          if [ -n "${{ inputs.regulation }}" ]; then
            python src/ingest.py --regulation "${{ inputs.regulation }}"
          else
            python src/ingest.py
          fi

      - name: Commit des nouvelles données
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Aucune nouvelle donnée ce mois-ci."
          else
            git commit -m "data: snapshot Smogon $(date -u +%Y-%m)"
            git push
          fi
