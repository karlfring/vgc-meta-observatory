[package]
name = "vgc-site"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Site privé de VGC Meta Overview : le tableau de bord, derrière une connexion"
license = "MIT"
publish = false

[dependencies]
argon2 = "0.6.0"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie-private", "cookie-key-expansion"] }
base64 = "0.23.1"
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["compression-gzip", "compression-br"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
http-body-util = "0.1.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
